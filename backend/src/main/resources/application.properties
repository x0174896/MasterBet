spring.application.name=masterbet
server.address=127.0.0.1
server.port=${SERVER_PORT:8081}
spring.config.import=optional:file:.env.local[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/masterbet_local}
spring.datasource.username=${DB_USERNAME:masterbet_app}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=true
masterbet.data-dir=${MASTERBET_DATA_DIR:../.local/data}
masterbet.odds-api-key=${ODDSPAPI_KEY:}
masterbet.api-reserve=10
spring.mvc.problemdetails.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
